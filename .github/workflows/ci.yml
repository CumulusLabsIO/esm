name: ESM Tests

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-precommit:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Environment
      uses: prefix-dev/setup-pixi@v0.9.0
      with:
        pixi-version: v0.82.1
        cache: false
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

    - name: Check formatting and typing
      run: pixi run --environment dev lint-all


  test-esm:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Environment
      uses: prefix-dev/setup-pixi@v0.9.0
      with:
        pixi-version: v0.82.1
        cache: false
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

    - name: Run tests
      run: pixi run --environment dev cov-test

    - name: Build Docker test image
      env:
        DOCKER_TAG: ${{ github.sha }}
      run: make -C tests build-oss-ci
      shell: pixi run --environment dev bash -e {0}

    # GitHub does not pass repository secrets to fork pull requests.
    - name: Run authenticated Docker tests
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      env:
        DOCKER_TAG: ${{ github.sha }}
        BIOHUB_URL: https://biohub.ai/
        ESM_API_KEY: ${{ secrets.ESM_API_KEY }}
      run: make -C tests start-docker-oss "URL=$BIOHUB_URL"
      shell: pixi run --environment dev bash -e {0}

    - name: Explain skipped authenticated Docker tests
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: echo 'Authenticated Docker tests require a repository secret and were skipped for this fork pull request.' >> "$GITHUB_STEP_SUMMARY"

    - name: cleanup docker containers if they're hanging
      if: ${{ always() }}
      run: |
          docker rm --force --volumes $(docker ps -q) || true

    # Report coverage in the job summary and comment on same-repository PRs.
    - name: Pytest Coverage Comment
      if: ${{ github.event_name == 'pull_request' }}
      uses: MishaKav/pytest-coverage-comment@v1.1.47
      id: coverageComment
      with:
        title: Coverage Report
        pytest-coverage-path: pytest-coverage.txt
        junitxml-path: pytest.xml
        report-only-changed-files: true
        hide-comment: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

    - name: Pytest GitHub summary
      if: ${{ github.event_name == 'pull_request' && steps.coverageComment.outputs.summaryReport != '' }}
      env:
        COVERAGE_REPORT: ${{ fromJSON(steps.coverageComment.outputs.summaryReport) }}
      run: printf '%s\n' "$COVERAGE_REPORT" >> "$GITHUB_STEP_SUMMARY"

  # `requires-python` no longer caps at 3.13, so the versions above it need
  # exercising. Tests only: the Docker suite and the coverage comment stay on the
  # 3.12 job, so they run once, against one environment and one set of secrets.
  test-esm-python-versions:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        environment: [dev-py313, dev-py314]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Environment
      uses: prefix-dev/setup-pixi@v0.9.0
      with:
        pixi-version: v0.82.1
        environments: ${{ matrix.environment }}
        cache: false

    - name: Run tests
      run: pixi run --environment ${{ matrix.environment }} cov-test
